name: GiftLink CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: giftlink-backend/package-lock.json
      - name: Install backend dependencies
        working-directory: giftlink-backend
        run: npm ci
      - name: Run backend tests
        working-directory: giftlink-backend
        env:
          MONGO_URL: memory://giftlink
          JWT_SECRET: ci-only-secret
        run: npm test

  sentiment-test:
    name: Sentiment service tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sentiment/package-lock.json
      - name: Install sentiment dependencies
        working-directory: sentiment
        run: npm ci
      - name: Run sentiment tests
        working-directory: sentiment
        run: npm test

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: giftlink-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: giftlink-frontend
        run: npm ci
      - name: Build React application
        working-directory: giftlink-frontend
        env:
          CI: false
          REACT_APP_BACKEND_URL: http://localhost:3060
        run: npm run build
